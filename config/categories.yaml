# Category rules for classifying INITIAL export rows into the 9 buckets
# (8 verticals + "その他"/other).
#
# Matching is against two INITIAL columns:
#   - tags:     the comma-separated "タグ" column (matched by EXACT token,
#               e.g. "EdTech" - never substring, since e.g. "MedTech"
#               contains the literal substring "edtech").
#   - industry: the "業種" column (exact match against the full value).
#
# Rules are evaluated top-to-bottom; the FIRST category whose tags OR
# industries match wins. More specific/rare vertical tags are listed
# before generic ones (BtoC / Consumer is deliberately last, since ~1/3
# of all rows carry a BtoC tag and would otherwise swallow everything).
# Anything matching nothing falls into "other".
#
# This file is meant to be tuned by hand as you see real classification
# results - it's data, not code.

categories:
  - name: EdTech
    tags: ["EdTech"]
    industries: []

  - name: FinTech
    tags: ["FinTech"]
    industries: ["金融・保険・不動産", "金融・保険・不動産 ICT"]

  - name: HealthTech
    tags: ["HealthTech"]
    industries: ["医療・ヘルスケア ICT"]

  - name: MedTech
    tags: ["MedTech"]
    industries: ["医療・ヘルスケア", "バイオテクノロジー", "バイオテクノロジー ICT"]

  - name: AgriTech
    tags: ["AgriTech", "農業"]
    industries: []

  - name: Media
    tags: ["メディア", "オウンドメディア", "メディア・エンタメ"]
    industries: []

  - name: DeepTech
    tags: ["研究開発型"]
    industries:
      - "半導体/その他電子部品・製品"
      - "産業・エネルギー"
      - "産業・エネルギー ICT"
      - "環境関連"
      - "環境関連 ICT"
      - "通信・ネットワーキング"
      - "コンピューター - ハードウェア"

  - name: Consumer
    tags: ["BtoC"]
    industries: ["消費者向けサービス・販売"]

# Anything that matches none of the above.
other_category: "other"
