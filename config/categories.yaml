# Category rules for classifying INITIAL export rows into the 8 buckets
# (7 verticals + "Other").
#
# Matching is against two INITIAL columns:
#   - tags:     the comma-separated "タグ" column (matched by EXACT token,
#               never substring).
#   - industry: the "業種" column (exact match against the full value).
#
# Rules are evaluated top-to-bottom; the FIRST category whose tags OR
# industries match wins. More specific/rare vertical tags are listed
# before generic ones. Anything matching nothing falls into "Other".
#
# NOTE: this taxonomy intentionally has no dedicated FinTech/HealthTech/
# MedTech/Consumer buckets (unlike an earlier version of this file) -
# those INITIAL tags are folded into "Tech" below since the daily digest
# only needs these 8 buckets. Retune freely; this is data, not code.
#
# This file is meant to be tuned by hand as you see real classification
# results - it's data, not code.

categories:
  - name: EdTech
    tags: ["EdTech", "教育"]
    industries: []

  - name: AgriTech
    tags: ["AgriTech", "農業"]
    industries: []

  - name: DeepTech
    tags: ["研究開発型", "ハードウェア"]
    industries:
      - "半導体/その他電子部品・製品"
      - "産業・エネルギー"
      - "産業・エネルギー ICT"
      - "環境関連"
      - "環境関連 ICT"
      - "通信・ネットワーキング"
      - "コンピューター - ハードウェア"

  - name: SaaS
    tags: ["SaaS", "クラウドサービス", "サブスクリプション"]
    industries: []

  - name: Entertainment
    tags: ["エンタメ", "メディア・エンタメ"]
    industries: []

  - name: Media
    tags: ["メディア", "オウンドメディア"]
    industries: []

  # Broad tech/software catch-all. Also absorbs the old FinTech/HealthTech/
  # MedTech verticals, since those are still fundamentally tech businesses
  # and this taxonomy has no dedicated bucket for them.
  - name: Tech
    tags:
      - "人工知能"
      - "ジェネレーティブAI"
      - "ソフトウェア"
      - "ソフトウェア開発"
      - "システム開発"
      - "モバイルアプリ"
      - "アプリ開発"
      - "アプリ"
      - "データ分析"
      - "FinTech"
      - "HealthTech"
      - "MedTech"
    industries:
      - "コンピューター - ソフトウェア"
      - "コンピューター - ITサービス"
      - "医療・ヘルスケア"
      - "医療・ヘルスケア ICT"
      - "バイオテクノロジー"
      - "バイオテクノロジー ICT"
      - "金融・保険・不動産"
      - "金融・保険・不動産 ICT"

# Anything that matches none of the above.
other_category: "Other"
